<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment</title>
<link rel="stylesheet" href="css/payment.css">
</head>

<body>

<div class="payment-card">
  <h2>Payment Details</h2>

  <form id="paymentForm">

    <div class="reservation-summary" id="reservationDetails"></div>

    <div class="total-price">
      Total: <span id="totalPrice"></span> EGP
    </div>

    <div class="form-group">
      <label>Payment Method</label>
      <select id="paymentMethod" required>
        <option value="">Select Payment Method</option>
        <option value="Cash">Cash</option>
        <option value="Visa">Visa</option>
      </select>
    </div>

    <div id="cardInfo" style="display:none;">
      <div class="form-group">
        <input type="text" id="cardNumber" placeholder="Card Number" required>
      </div>
      <div class="form-group">
        <input type="month" id="expiry" required>
      </div>
      <div class="form-group">
        <input type="password" id="cvv" placeholder="CVV" required>
      </div>
    </div>

    <button type="submit" class="btn-confirm-payment">Confirm Payment</button>
  </form>
</div>

<script>
let reservation = JSON.parse(localStorage.getItem("pendingReservation"));
let pricePerPerson = 150;
let total =
  reservation.guests * pricePerPerson + reservation.preorderPrice;

document.getElementById("totalPrice").innerText = total;

let foodHTML =
  reservation.orderType === "preorder"
    ? reservation.preorder
        .map(i => `<p>${i.item} x${i.qty} = ${i.price} EGP</p>`)
        .join("")
    : "<p><b>Food:</b> Order at Restaurant</p>";

document.getElementById("reservationDetails").innerHTML = `
  <p><b>Name:</b> ${reservation.userName}</p>
  <p><b>Date:</b> ${reservation.date}</p>
  <p><b>Time:</b> ${reservation.time}</p>
  <p><b>Guests:</b> ${reservation.guests}</p>
  ${foodHTML}
`;

// Show/hide card info
document.getElementById("paymentMethod").addEventListener("change", function(){
  document.getElementById("cardInfo").style.display =
    this.value === "Visa" ? "block" : "none";
});

// Confirm Payment
document.getElementById("paymentForm").addEventListener("submit", function(e){
  e.preventDefault();

  let paymentMethod = document.getElementById("paymentMethod").value;

  if (!paymentMethod) {
    alert("Please select payment method");
    return;
  }

  // If Visa, validate card fields
  if (paymentMethod === "Visa") {
    let cardNumber = document.getElementById("cardNumber");
    let expiry = document.getElementById("expiry");
    let cvv = document.getElementById("cvv");

    if (!cardNumber.value || !expiry.value || !cvv.value) {
      cardNumber.reportValidity();
      expiry.reportValidity();
      cvv.reportValidity();
      return;
    }
  }

  // Save reservation
  reservation.payment = paymentMethod;
  reservation.status = "Paid";

  let reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
  reservations.push(reservation);
  localStorage.setItem("reservations", JSON.stringify(reservations));
  localStorage.removeItem("pendingReservation");

  window.location.href = "success.html";
});
</script>

</body>
</html>
